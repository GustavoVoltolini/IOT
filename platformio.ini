; Alimentador automático de gato — ESP32 DevKit (WROOM)
;
;   pio run -e esp32dev                 compila
;   pio run -e esp32dev -t upload       grava no ESP32
;   pio device monitor                  serial (115200)
;   pio test -e native                  testa a lógica pura no PC (sem ESP32)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; O chip USB CH9102 desta placa perde bytes quando o stub do esptool arranca
; ("Invalid head of packet 0x48/0x49"). Sem stub grava pelo bootloader da ROM: mais lento, mas confiável.
; Se atualizar o driver WCH CH343SER, pode remover esta linha.
upload_flags = --no-stub
monitor_filters = esp32_exception_decoder
monitor_echo = yes
; A página web vai embutida no firmware: não precisa gravar sistema de arquivos.
board_build.embed_txtfiles = src/web/index.html
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    madhephaestus/ESP32Servo@3.2.1
    bblanchon/ArduinoJson@7.4.3

[env:native]
platform = native
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1
build_flags = -std=c++17 -Wall -Wextra
